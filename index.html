<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Facu & Jaz</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f5;
            padding: 15px;
            max-width: 600px;
            margin: auto;
            color: #18181b;
        }

        h1 {
            text-align: center;
            margin: 10px 0 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.15rem;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .stat {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 13px 7px;
            text-align: center;
        }

        .stat small {
            display: block;
            color: #64748b;
            margin-bottom: 5px;
        }

        .number {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .facu {
            color: #2563eb;
        }

        .jaz {
            color: #db2777;
        }

        .green {
            color: #047857;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1rem;
        }

        input,
        select {
            border: 1px solid #cbd5e1;
            background: white;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(.99);
        }

        .gasto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .gasto:last-child {
            border-bottom: none;
        }

        .info {
            flex: 1;
        }

        .info strong {
            display: block;
        }

        .info small {
            color: #64748b;
        }

        .monto {
            text-align: right;
            font-weight: bold;
            white-space: nowrap;
        }

        .borrar {
            background: #fee2e2;
            color: #b91c1c;
            width: auto;
            padding: 6px 8px;
            margin: 5px 0 0;
            font-size: .8rem;
        }

        .mensaje {
            text-align: center;
            color: #64748b;
            padding: 15px 0;
        }

        .estado {
            text-align: center;
            font-size: .85rem;
            color: #64748b;
            margin-top: 5px;
        }

        hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 18px 0;
        }
    </style>
</head>

<body>

<h1>💰 Gastos Facu & Jaz</h1>

<!-- FONDO -->
<div class="card">

    <h2>💵 Fondo común</h2>

    <div class="grid">

        <div class="stat">
            <small>Dinero agregado</small>
            <div id="ingreso" class="number">$0</div>
        </div>

        <div class="stat">
            <small>Disponible</small>
            <div id="disponible" class="number green">$0</div>
        </div>

    </div>

    <br>

    <input
        type="number"
        id="montoFondo"
        placeholder="¿Cuánto agregamos?"
        min="0"
    >

    <button onclick="agregarFondo()">
        ➕ Agregar al fondo
    </button>

</div>


<!-- RESUMEN -->
<div class="card">

    <h2>📊 Resumen</h2>

    <div class="grid3">

        <div class="stat">
            <small>Facu</small>
            <div id="facu" class="number facu">$0</div>
        </div>

        <div class="stat">
            <small>Jaz</small>
            <div id="jaz" class="number jaz">$0</div>
        </div>

        <div class="stat">
            <small>A medias</small>
            <div id="medias" class="number">$0</div>
        </div>

    </div>

    <hr>

    <div class="stat">
        <small>Total gastado</small>
        <div id="total" class="number">$0</div>
    </div>

</div>


<!-- NUEVO GASTO -->
<div class="card">

    <h2>🧾 Registrar gasto</h2>

    <input
        type="text"
        id="concepto"
        placeholder="Ej. Supermercado"
    >

    <input
        type="number"
        id="monto"
        placeholder="Monto ($)"
        min="0"
    >

    <select id="persona">

        <option value="Facu">
            👨 Facu pagó
        </option>

        <option value="Jaz">
            👩 Jaz pagó
        </option>

        <option value="A medias">
            🤝 Lo pagamos a medias
        </option>

    </select>

    <button onclick="agregarGasto()">
        ➕ Agregar gasto
    </button>

</div>


<!-- HISTORIAL -->
<div class="card">

    <h2>📋 Historial</h2>

    <div id="historial">
        <div class="mensaje">
            Cargando...
        </div>
    </div>

    <div id="estado" class="estado">
        Conectando...
    </div>

</div>


<script>

    // ==========================================
    // CONFIGURACIÓN SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://ofejunrkrjybfvbqmzzh.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_HU_bsdvSPB24bPM0yIxRCg_6be0Btn3";


    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // FORMATO DE DINERO
    // ==========================================

    function dinero(numero) {

        return "$" + numero.toLocaleString(
            "es-UY",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

    }


    // ==========================================
    // CARGAR DATOS
    // ==========================================

    async function cargarDatos() {

        const { data, error } = await db
            .from("gastos_pareja")
            .select("*")
            .order("fecha", {
                ascending: false
            });


        if (error) {

            console.error(error);

            document.getElementById("estado").innerText =
                "❌ Error de conexión con la base";

            return;
        }


        document.getElementById("estado").innerText =
            "🟢 Conectado";


        renderizar(data || []);

    }


    // ==========================================
    // MOSTRAR DATOS
    // ==========================================

    function renderizar(datos) {

        let ingresos = 0;

        let totalGastos = 0;

        let facu = 0;

        let jaz = 0;

        let medias = 0;


        datos.forEach(item => {

            if (item.tipo === "ingreso") {

                ingresos += Number(item.monto);

            }


            if (item.tipo === "gasto") {

                totalGastos += Number(item.monto);


                if (item.persona === "Facu") {

                    facu += Number(item.monto);

                }


                if (item.persona === "Jaz") {

                    jaz += Number(item.monto);

                }


                if (item.persona === "A medias") {

                    medias += Number(item.monto);

                }

            }

        });


        const disponible =
            ingresos - totalGastos;


        document.getElementById("ingreso")
            .innerText = dinero(ingresos);


        document.getElementById("disponible")
            .innerText = dinero(disponible);


        document.getElementById("facu")
            .innerText =
            dinero(facu + medias / 2);


        document.getElementById("jaz")
            .innerText =
            dinero(jaz + medias / 2);


        document.getElementById("medias")
            .innerText =
            dinero(medias);


        document.getElementById("total")
            .innerText =
            dinero(totalGastos);


        mostrarHistorial(datos);

    }


    // ==========================================
    // MOSTRAR HISTORIAL
    // ==========================================

    function mostrarHistorial(datos) {

        const historial =
            document.getElementById("historial");


        if (datos.length === 0) {

            historial.innerHTML = `
                <div class="mensaje">
                    Todavía no hay movimientos.
                </div>
            `;

            return;
        }


        historial.innerHTML = "";


        datos.forEach(item => {

            let icono = "💰";


            if (item.tipo === "gasto") {

                if (item.persona === "Facu")
                    icono = "👨";

                if (item.persona === "Jaz")
                    icono = "👩";

                if (item.persona === "A medias")
                    icono = "🤝";

            }


            const fecha =
                new Date(item.fecha)
                    .toLocaleDateString("es-UY");


            historial.innerHTML += `

                <div class="gasto">

                    <div class="info">

                        <strong>
                            ${icono}
                            ${escapeHTML(item.concepto)}
                        </strong>

                        <small>
                            ${item.tipo === "ingreso"
                                ? "Fondo común"
                                : item.persona}
                            · ${fecha}
                        </small>

                    </div>

                    <div class="monto">

                        ${dinero(Number(item.monto))}

                        <br>

                        <button
                            class="borrar"
                            onclick="eliminarMovimiento('${item.id}')"
                        >
                            Eliminar
                        </button>

                    </div>

                </div>

            `;

        });

    }


    // ==========================================
    // SEGURIDAD PARA TEXTO
    // ==========================================

    function escapeHTML(texto) {

        const div =
            document.createElement("div");

        div.textContent = texto;

        return div.innerHTML;

    }


    // ==========================================
    // AGREGAR FONDO
    // ==========================================

    async function agregarFondo() {

        const input =
            document.getElementById("montoFondo");


        const monto =
            Number(input.value);


        if (!monto || monto <= 0) {

            alert("Ingresá un monto válido.");

            return;
        }


        const { error } = await db
            .from("gastos_pareja")
            .insert({

                tipo: "ingreso",

                concepto: "Fondo común",

                monto: monto,

                persona: null

            });


        if (error) {

            console.error(error);

            alert(
                "No se pudo guardar el fondo."
            );

            return;
        }


        input.value = "";

        cargarDatos();

    }


    // ==========================================
    // AGREGAR GASTO
    // ==========================================

    async function agregarGasto() {

        const concepto =
            document.getElementById("concepto")
                .value.trim();


        const monto =
            Number(
                document.getElementById("monto")
                    .value
            );


        const persona =
            document.getElementById("persona")
                .value;


        if (!concepto || !monto || monto <= 0) {

            alert(
                "Ingresá un concepto y un monto válido."
            );

            return;
        }


        const { error } = await db
            .from("gastos_pareja")
            .insert({

                tipo: "gasto",

                concepto: concepto,

                monto: monto,

                persona: persona

            });


        if (error) {

            console.error(error);

            alert(
                "No se pudo guardar el gasto."
            );

            return;
        }


        document.getElementById("concepto")
            .value = "";

        document.getElementById("monto")
            .value = "";


        cargarDatos();

    }


    // ==========================================
    // ELIMINAR
    // ==========================================

    async function eliminarMovimiento(id) {

        const confirmar =
            confirm(
                "¿Querés eliminar este movimiento?"
            );


        if (!confirmar) return;


        const { error } = await db
            .from("gastos_pareja")
            .delete()
            .eq("id", id);


        if (error) {

            console.error(error);

            alert(
                "No se pudo eliminar."
            );

            return;
        }


        cargarDatos();

    }


    // ==========================================
    // ACTUALIZACIÓN AUTOMÁTICA
    // ==========================================

    db.channel("gastos-en-vivo")

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "gastos_pareja"
            },
            () => {

                cargarDatos();

            }
        )

        .subscribe();


    // ==========================================
    // INICIO
    // ==========================================

    cargarDatos();

</script>

</body>
</html>
